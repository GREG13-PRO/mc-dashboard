name: App release

# Builds the installers on a tag. The Windows one needs a Windows runner:
# electron-builder can cross-build it from macOS only through wine, and a
# real runner avoids that whole class of problem. The macOS dmg genuinely
# cannot be produced anywhere but macOS.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Each build job attaches its own output straight to the release. The previous
# shape parked every installer in artifact storage so a separate job could
# download them again - about 280 MB per release, which filled the account's
# artifact quota and then failed every build with "Artifact storage quota has
# been hit". The round trip bought nothing: the files were already on a runner
# that can talk to the releases API.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: dist:mac
            artifact: dmg
          - os: windows-latest
            target: dist:win
            artifact: exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The root install is not optional: this is a workspaces monorepo, so
      # TypeScript hoists to the root node_modules, and prepare-backend needs it
      # to compile the backend it bundles. Installing only in desktop/ is why
      # every installer build since v2.39.0 failed with "A TypeScript fordító
      # nincs telepítve" - the APK and the plugin kept building, so the release
      # was never empty enough to notice.
      - name: Install root dependencies
        run: npm ci || npm install

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci || npm install

      - name: Build installer
        working-directory: desktop
        run: npm run ${{ matrix.target }}
        env:
          # Unsigned builds: there is no Apple Developer ID or Windows
          # certificate for this project, so skip signing rather than fail.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Publish to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # Each matrix job builds exactly one of these, so listing both here
          # made the mac job demand an exe and the Windows job a dmg.
          files: desktop/release/*.${{ matrix.artifact }}
          fail_on_unmatched_files: true


  # The APK is built on a Linux runner because that is the one with the Android
  # SDK already installed; nothing about the build is platform-specific.
  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate the Gradle wrapper
        working-directory: android
        # Pinned here rather than committing a wrapper jar: a binary in the
        # repository is exactly the kind of thing nobody reviews, and this
        # project has been burned once by an unreviewed jar.
        run: gradle wrapper --gradle-version 8.7

      - name: Restore the signing key
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.jks

      - name: Build the APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/android/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ github.ref_name }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the APK after the tag
        working-directory: android
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk \
            "out/mc-dashboard-${GITHUB_REF_NAME:-dev}.apk"
          rm -f release.jks

      - name: Publish to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/out/*.apk
          fail_on_unmatched_files: true


  # The anti-cheat plugin. Built on the same runner family as the APK; the only
  # dependency is Paper's API, which the server provides at runtime.
  plugin:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate the Gradle wrapper
        working-directory: plugin
        run: gradle wrapper --gradle-version 8.7

      - name: Build the plugin
        working-directory: plugin
        env:
          GUARD_VERSION: ${{ github.ref_name }}
        run: ./gradlew --no-daemon build

      - name: Publish to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: plugin/build/libs/McDashGuard-*.jar
          fail_on_unmatched_files: true
