<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0a0710" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- SVG first: the mark is three polygons, so a vector stays crisp on a
         retina tab strip where a 192px raster does not. The PNG stays as the
         fallback for anything that ignores the first line. -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Minecraft Dashboard</title>
    <script>
      // Applied before the stylesheet paints: otherwise a stored "light" choice
      // shows the dark default (or the reverse) for a frame on every load.
      try {
        var t = localStorage.getItem("mc-dashboard-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
